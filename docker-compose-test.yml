# Docker Compose for running the API pytest suite in a contained environment.
#
# Prerequisites and full workflow: apps/api/tests/RUNNING_TESTS.md#prerequisites
# and #running-the-suite; local setup: docs/development.md#首次配置与已有环境.
#
# Quick usage (from the repository root):
#   docker compose -p plane-test -f docker-compose-test.yml up --build --abort-on-container-exit --exit-code-from api-tests
#   docker compose -p plane-test -f docker-compose-test.yml run --rm --build api-tests pytest -m unit
#   docker compose -p plane-test -f docker-compose-test.yml down -v
#
# Always use -p plane-test for the whole stack, including workflow-runner.
# Data dirs use tmpfs; stopped/removed containers lose data, but running ones retain it.
# Use down -v only for this test project; local updates/migrations use the local stack.
# Service/env details and troubleshooting: apps/api/tests/RUNNING_TESTS.md#how-it-works
# and #troubleshooting.

services:
  test-db:
    image: postgres:15.7-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-redis:
    image: valkey/valkey:7.2.11-alpine
    networks:
      - test_env
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-mq:
    image: rabbitmq:3.13.6-management-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  test-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME:-uploads} &&
      silo server /export --console-address ':9090' &
      sleep 3 &&
      mc alias set local http://localhost:9000 ${AWS_ACCESS_KEY_ID:-access-key} ${AWS_SECRET_ACCESS_KEY:-secret-key} &&
      mc mb local/${AWS_S3_BUCKET_NAME:-uploads} -p || true &&
      tail -f /dev/null
      "
    tmpfs:
      - /export
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  workflow-runner:
    build:
      context: .
      dockerfile: apps/workflow-runner/Dockerfile
    networks:
      - test_env
    environment:
      WORKFLOW_RUNNER_SERVICE_TOKEN: test-workflow-runner-service-token-32chars
      WORKFLOW_RUNNER_BROKER_ORIGIN: http://api-tests:8000
      WORKFLOW_RUNNER_MAX_CONCURRENT: "2"
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: "1.0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000

  api-tests:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.test
      WORKFLOW_RUNNER_URL: http://workflow-runner:8080
      WORKFLOW_RUNNER_SERVICE_TOKEN: test-workflow-runner-service-token-32chars
      WORKFLOW_RUNNER_BROKER_URL: http://api-tests:8000/api/internal/workflow-runner/rpc/
      # Override service hostnames to point at the test-only services above.
      POSTGRES_HOST: test-db
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}
      REDIS_HOST: test-redis
      REDIS_URL: redis://test-redis:6379/
      RABBITMQ_HOST: test-mq
      AWS_S3_ENDPOINT_URL: http://test-minio:9000
      # Magic-link tests mock the celery delay but the view first checks that
      # EMAIL_HOST is configured. Set a placeholder so the check passes.
      EMAIL_HOST: test-smtp.invalid
    volumes:
      - ./apps/api:/code
    working_dir: /code
    depends_on:
      workflow-runner:
        condition: service_healthy
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-mq:
        condition: service_healthy
      test-minio:
        condition: service_healthy
    # The image already carries the test group; re-sync against the mounted
    # uv.lock (a no-op unless it changed since the image was built), then exec pytest.
    # Args passed via `docker compose -p plane-test -f docker-compose-test.yml run api-tests <args>` replace the default command.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if ! command -v uv >/dev/null 2>&1; then
          echo "api-tests image predates the uv migration; rebuild it: docker compose -f docker-compose-test.yml build api-tests" >&2
          exit 1
        fi
        uv sync --locked --inexact
        # STATIC_ROOT must exist or Django's static middleware emits a
        # UserWarning on every request (~100 of the warnings in test runs).
        mkdir -p plane/static-assets/collected-static
        exec "$@"
      - --
    command: ["pytest"]

networks:
  test_env:
    driver: bridge
