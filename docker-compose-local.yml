services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    networks:
      - dev_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      silo server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9090:9090"

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  workflow-runner:
    build:
      context: .
      dockerfile: apps/workflow-runner/Dockerfile
    restart: unless-stopped
    networks:
      - dev_env
    environment:
      WORKFLOW_RUNNER_SERVICE_TOKEN: ${WORKFLOW_RUNNER_SERVICE_TOKEN:-}
      WORKFLOW_RUNNER_BROKER_ORIGIN: http://api:8000
      WORKFLOW_RUNNER_MAX_CONCURRENT: "2"
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: "1.0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000

  api:
    # Built once here; worker, beat-worker and migrator reuse this image
    image: plane-api:local
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - ./apps/api/.env
    environment:
      WORKFLOW_RUNNER_URL: http://workflow-runner:8080
      WORKFLOW_RUNNER_SERVICE_TOKEN: ${WORKFLOW_RUNNER_SERVICE_TOKEN:-}
      WORKFLOW_RUNNER_BROKER_URL: http://api:8000/api/internal/workflow-runner/rpc/
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "8000:8000"

  worker:
    image: plane-api:local
    pull_policy: never
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    environment:
      WORKFLOW_RUNNER_URL: http://workflow-runner:8080
      WORKFLOW_RUNNER_SERVICE_TOKEN: ${WORKFLOW_RUNNER_SERVICE_TOKEN:-}
      WORKFLOW_RUNNER_BROKER_URL: http://api:8000/api/internal/workflow-runner/rpc/
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    image: plane-api:local
    pull_policy: never
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    environment:
      WORKFLOW_RUNNER_URL: http://workflow-runner:8080
      WORKFLOW_RUNNER_SERVICE_TOKEN: ${WORKFLOW_RUNNER_SERVICE_TOKEN:-}
      WORKFLOW_RUNNER_BROKER_URL: http://api:8000/api/internal/workflow-runner/rpc/
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    image: plane-api:local
    pull_policy: never
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    environment:
      WORKFLOW_RUNNER_URL: http://workflow-runner:8080
      WORKFLOW_RUNNER_SERVICE_TOKEN: ${WORKFLOW_RUNNER_SERVICE_TOKEN:-}
      WORKFLOW_RUNNER_BROKER_URL: http://api:8000/api/internal/workflow-runner/rpc/
    depends_on:
      - plane-db
      - plane-redis

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:

networks:
  dev_env:
    driver: bridge
