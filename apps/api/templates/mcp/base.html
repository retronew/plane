<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}连接 Plane{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: light-dark(#f7f8fa, #15171b); color: light-dark(#20242c, #eee); }
    main { max-width: 560px; margin: 8vh auto; padding: 32px; background: light-dark(white, #202329); border: 1px solid light-dark(#d9dce2, #484d57); border-radius: 16px; }
    h1 { font-size: 24px; margin-top: 0; } p { line-height: 1.65; }
    small { display: block; overflow-wrap: anywhere; color: light-dark(#565e6c, #b5bcc7); line-height: 1.6; }
    label { display: block; margin: 20px 0 8px; } select { width: 100%; padding: 12px; font: inherit; border-radius: 8px; }
    button { font: inherit; padding: 10px 20px; border: 1px solid #777; border-radius: 8px; cursor: pointer; }
    button[value="allow"] { background: #315bd6; color: white; border-color: #315bd6; }
    button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #5284ff; outline-offset: 3px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    article { border-top: 1px solid #888; padding: 20px 0; } a { color: light-dark(#234fbd, #a9c4ff); }
    @media (max-width: 640px) { main { margin: 24px 12px; padding: 24px; } }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
